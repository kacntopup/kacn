name: Generate Sitemap
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sitemap.xml
        run: |
          import os
          from datetime import datetime
          base_url = "https://kacntopup.github.io/kacn/"
          exclude = ["README.md"]
          urls = []
          for f in os.listdir("."):
            if f.endswith(".md") and f not in exclude:
              name = f.replace(".md", "")
              if name == "index":
                path = base_url
              else:
                path = base_url + name
              urls.append(path)
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          today = datetime.now().strftime("%Y-%m-%d")
          for u in urls:
            prio = "1.0" if u.endswith("/") else "0.8"
            xml += f'  <url>\n    <loc>{u}</loc>\n    <lastmod>{today}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>{prio}</priority>\n  </url>\n'
          xml += "</urlset>"
          with open("sitemap.xml","w",encoding="utf-8") as f:
            f.write(xml)
          print("sitemap generated")

      - name: Commit & Push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto update sitemap.xml" || echo "No changes to commit"
          git push
